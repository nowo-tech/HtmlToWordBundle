name: html-to-word-bundle-demo-symfony-7

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: html-to-word-bundle-demo-symfony7-php
    working_dir: /app
    ports:
      - "${PORT:-8020}:80"
    volumes:
      - .:/app
      - ../..:/var/html-to-word-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-1}
      - APP_SECRET=${APP_SECRET:-demo-secret}
    # Mitigate Docker/WSL DNS failures resolving repo.packagist.org (composer curl error 6).
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - html-to-word-demo-network

volumes:
  composer-cache:
    driver: local

networks:
  html-to-word-demo-network:
    driver: bridge
