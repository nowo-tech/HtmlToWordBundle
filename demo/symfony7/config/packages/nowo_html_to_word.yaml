# Single engine: phpword (PhpOffice). HTML is parsed with masterminds/html5; only ResolvedConfig changes here.
# Public API unchanged: convert() | convertWithProfile() | convertWithOptions() — see the demo controller.
nowo_html_to_word:
    engine: phpword
    default_profile: default

    profiles:
        default:
            strict_mode: false
            export:
                filename: demo-default.docx

        # strict_mode: rejects tags without a transformer (useful with the "minimal" preset).
        estricto:
            strict_mode: true
            export:
                filename: demo-estricto.docx

        informe:
            page:
                orientation: landscape
                margins:
                    top: 1134
                    right: 1134
                    bottom: 1134
                    left: 1134
            fonts:
                default: Calibri
                default_size: 10
            tables:
                repeat_header_row: true
            export:
                filename: demo-informe-landscape.docx

        membrete:
            page:
                margins:
                    top: 1800
                    right: 1440
                    bottom: 1800
                    left: 1440
            fonts:
                default: 'Times New Roman'
                default_size: 11
            header:
                enabled: true
                text: 'HtmlToWordBundle · DOCX export demo'
                logo: '%kernel.project_dir%/public/demo-assets/demo-logo.png'
                logo_width: 128
                show_page_number: false
            footer:
                enabled: true
                text: 'Generated for testing only · '
                show_page_number: true
            tables:
                repeat_header_row: true
            export:
                filename: demo-membrete.docx

        # Footer only + page number (PhpWord preserves footer text).
        pie_solo:
            header:
                enabled: false
            footer:
                enabled: true
                text: 'Footer only · '
                show_page_number: true
            export:
                filename: demo-pie-solo.docx

        # US Letter paper (SectionConfigurator size LETTER).
        carta_us:
            page:
                size: LETTER
                margins:
                    top: 1440
                    right: 1440
                    bottom: 1440
                    left: 1440
            export:
                filename: demo-letter.docx

        tablas_avanzado:
            fonts:
                default_size: 10
            tables:
                repeat_header_row: true
            export:
                filename: demo-tablas.docx

        # Compare PHPWord tblHeader vs table without header repeat.
        tablas_sin_repeat:
            fonts:
                default_size: 10
            tables:
                repeat_header_row: false
            export:
                filename: demo-tablas-sin-repeat.docx

        # Remote images + max width (ImageResolver + GD in PHP runtime).
        imagen_ancha:
            images:
                max_width: 720
                resolve_remote: true
            export:
                filename: demo-imagen.docx

        densidad:
            fonts:
                default_size: 11
            tables:
                repeat_header_row: true
            export:
                filename: demo-paginacion.docx

        # Whole document: default font / size (fonts.default / fonts.default_size → PhpWord).
        fuente_arial_16:
            fonts:
                default: Arial
                default_size: 16
            export:
                filename: demo-fuente-arial-16.docx

        fuente_times_13:
            fonts:
                default: 'Times New Roman'
                default_size: 13
            export:
                filename: demo-fuente-times-13.docx

        fuente_verdana_10:
            fonts:
                default: Verdana
                default_size: 10
            export:
                filename: demo-fuente-verdana-10.docx

        fuente_courier_11:
            fonts:
                default: 'Courier New'
                default_size: 11
            export:
                filename: demo-fuente-courier-11.docx
