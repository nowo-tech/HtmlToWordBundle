# HtmlToWordBundle — service wiring (public API: converter + exporter + extensible transformers)

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        Nowo\HtmlToWordBundle\Transformer\TransformerInterface:
            tags: ['html_to_word.transformer']
        Nowo\HtmlToWordBundle\Engine\WordEngineInterface:
            tags: ['html_to_word.engine']

    Nowo\HtmlToWordBundle\Builder\:
        resource: '../../Builder'
        exclude:
            - '../../Builder/WordDocumentBuilder.php'

    Nowo\HtmlToWordBundle\Config\:
        resource: '../../Config'

    Nowo\HtmlToWordBundle\Converter\:
        resource: '../../Converter'

    Nowo\HtmlToWordBundle\Engine\:
        resource: '../../Engine'
        exclude:
            - '../../Engine/{WordEngineInterface.php,EngineRegistry.php}'

    Nowo\HtmlToWordBundle\Engine\EngineRegistry:
        arguments:
            $engines: !tagged_iterator html_to_word.engine

    Nowo\HtmlToWordBundle\Converter\HtmlToWordConverter:
        public: true
        arguments:
            $engineName: '%nowo_html_to_word.engine%'

    Nowo\HtmlToWordBundle\Export\:
        resource: '../../Export'

    Nowo\HtmlToWordBundle\Builder\ImageResolverInterface:
        alias: Nowo\HtmlToWordBundle\Builder\ImageResolver

    # Shared across ImageResolver + RemoteHttpImageInliner; ResetInterface + kernel.terminate (worker mode).
    Nowo\HtmlToWordBundle\Builder\TemporaryImageFiles: ~

    Nowo\HtmlToWordBundle\Builder\WordDocumentBuilder:
        autowire: false
        arguments:
            $sanitizer: '@Nowo\HtmlToWordBundle\Parser\HtmlSanitizer'
            $remoteHttpImageInliner: '@Nowo\HtmlToWordBundle\Parser\RemoteHttpImageInliner'
            $parser: '@Nowo\HtmlToWordBundle\Parser\HtmlParser'
            $sectionConfigurator: '@Nowo\HtmlToWordBundle\Builder\SectionConfigurator'
            $headerFooterBuilder: '@Nowo\HtmlToWordBundle\Builder\HeaderFooterBuilder'
            $transformerChain: '@Nowo\HtmlToWordBundle\Transformer\TransformerChain'
            $inlineComposer: '@Nowo\HtmlToWordBundle\Builder\InlineComposer'

    Nowo\HtmlToWordBundle\Parser\:
        resource: '../../Parser'

    Nowo\HtmlToWordBundle\Transformer\:
        resource: '../../Transformer'
        exclude:
            - '../../Transformer/{TransformerChain.php,TransformerInterface.php,DocumentWalkerInterface.php}'

    Nowo\HtmlToWordBundle\Config\ProfileResolver:
        arguments:
            $profiles: '%nowo_html_to_word.profiles%'
            $defaultProfile: '%nowo_html_to_word.default_profile%'

    Nowo\HtmlToWordBundle\Transformer\TransformerChain:
        arguments:
            $transformers: !tagged_iterator html_to_word.transformer

    # $flysystem: optional default FilesystemOperator (override in the app); $flysystemAdapters: service locator
    # built by HtmlToWordExtension from profiles.*.export.flysystem_adapter (null when no profile sets one).
    Nowo\HtmlToWordBundle\Export\DocxExporter:
        arguments:
            $flysystem: null
            $flysystemAdapters: null

    Nowo\HtmlToWordBundle\Converter\HtmlToWordConverterInterface:
        alias: Nowo\HtmlToWordBundle\Converter\HtmlToWordConverter

    # Framework-free output port (1.8.0). Alias or decorate it to replace the writer: DocxResponseFactory follows it.
    Nowo\HtmlToWordBundle\Export\DocumentWriterInterface:
        alias: Nowo\HtmlToWordBundle\Export\DocxExporter
        public: true

    # HTTP edge (1.8.0): responses built through DocumentWriterInterface.
    Nowo\HtmlToWordBundle\Http\DocxResponseFactory:
        public: true

    # Deprecated since 1.8.0 (removed in 2.0). DocxExporter implements it; a host that re-aliases it must point it at
    # a service that implements it (Symfony's lint:container checks this).
    Nowo\HtmlToWordBundle\Export\ExporterInterface:
        alias: Nowo\HtmlToWordBundle\Export\DocxExporter
        deprecated:
            package: nowo-tech/html-to-word-bundle
            version: '1.8'
            message: 'The "%alias_id%" service alias is deprecated, use "Nowo\HtmlToWordBundle\Export\DocumentWriterInterface" and "Nowo\HtmlToWordBundle\Http\DocxResponseFactory" instead.'
